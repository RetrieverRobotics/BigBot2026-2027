[project]
name = "visionsystem"
version = "0.1.0"
description = "Coprocessor perception for the VEX U Override robots"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "pyserial>=3.5",
]

[project.scripts]
visionsystem = "visionsystem.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionsystem"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
